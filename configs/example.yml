project:
  name: example-moodle
  environment: staging
  timezone: America/Santiago

moodle:
  root: /var/www/example/public_html
  moodledata: /var/www/example/moodledata
  base_url: https://moodle.example.invalid
  target_version: "5.0"
  maintenance_mode_command: ["php", "admin/cli/maintenance.php", "--enable"]
  maintenance_off_command: ["php", "admin/cli/maintenance.php", "--disable"]
  upgrade_command: ["php", "admin/cli/upgrade.php", "--non-interactive"]
  purge_caches_command: ["php", "admin/cli/purge_caches.php"]
  cron_command: ["php", "admin/cli/cron.php"]

safety:
  allow_mutation: false
  require_environment: staging
  require_clean_git: true
  require_backup_check: true
  require_human_gate: true
  max_backup_age_hours: 24

inventory:
  min_free_gb: 5

endpoints:
  - id: login
    method: GET
    path: /login/index.php
    expected_status: 200
    severity: critical
    timeout_seconds: 15
    verify_tls: true
  - id: homepage
    method: GET
    path: /
    expected_status: 200
    severity: critical
    timeout_seconds: 15

logs:
  required: false
  fail_baseline_on_critical: false
  files:
    - /var/log/nginx/error.log
    - /var/log/php/error.log
  # Docker stdout/stderr sources are bounded and raw text is never persisted.
  # sources:
  #   - id: php-container
  #     type: docker
  #     container: example-php-1
  #     tail_lines: 5000
  #     required: true
  patterns:
    critical:
      - "PHP Fatal error"
      - "Uncaught Error"
      - "Allowed memory size"
      - "upstream sent too big header"
    warning:
      - "PHP Warning"
      - "PHP Deprecated"
      - " 500 "

plugins:
  custom_roots:
    - local
    - report
    - blocks
    - mod
    - auth
  custom_paths: []
  compatibility: {}
  ignore:
    - mod/forum
  # Optional local, known-clean Git source-core reference. The capability
  # verifies its version.php against inventory before classifying components.
  # It never fetches refs or writes to either repository.
  # core_reference:
  #   repository: /srv/moodle-upstream
  #   ref: v4.5.7  # Must exactly match the inventoried source release.
  #   root: .
  #   max_files: 100000
  #   max_files_per_component: 20000
  #   max_changed_files: 5000

custom_code:
  paths: []
  auto_detect_top_level: true
  max_files_per_path: 50000
  scan_max_files_per_path: 20000
  scan_max_bytes_per_file: 1000000

backup:
  paths:
    - /backups/moodle
  required_components:
    - database
    - code
    - moodledata
  max_age_hours: 24
  checksum: false
  components:
    database:
      globs:
        - "database*.sql"
        - "database*.sql.gz"
    code:
      globs:
        - "code*.tar.gz"
        - "code*.tgz"
    moodledata:
      globs:
        - "moodledata*.tar.gz"
        - "moodledata*.tgz"

database:
  driver: mysql
  prefix: mdl_
  # Optional Docker DB container. The database client still receives credentials
  # only through the environment variables below; secrets are never stored here.
  runtime_container: null
  connection_env:
    host: MOODLE_DB_HOST
    port: MOODLE_DB_PORT
    database: MOODLE_DB_NAME
    user: MOODLE_DB_USER
    password: MOODLE_DB_PASSWORD
  # Alternative for a DB client running inside a trusted container. Only names
  # are configured; credential values remain inside the container environment.
  # Remove connection_env before enabling this alternative.
  # container_connection_env:
  #   database: MYSQL_DATABASE
  #   user: MYSQL_USER
  #   password: MYSQL_PASSWORD
  # container_host: 127.0.0.1
  # container_port: 3306
  max_sample_rows: 20
  timeout_seconds: 30
  checks:
    - id: duplicate_emails
      severity: critical
      expect: empty
      sql_file: sql/checks/duplicate_emails.sql
    - id: failed_scheduled_tasks
      severity: warning
      expect: empty
      sql_file: sql/checks/failed_scheduled_tasks.sql

upgrade:
  # Mandatory before an executable upgrade. Use an argv list or a dedicated
  # reviewed script; never place shell operators or credentials here.
  code_transition_command: null
  run_cron_after: true

rollback:
  # Deliberately empty in the generic example. Rollback never infers restore
  # commands from backup filenames; each environment must define them explicitly.
  commands: []

documentation:
  provider: google-drive
  folder_id: null
  document_id: null
  require_sync: false
  include_raw_logs: false
  redact_patterns:
    - "password"
    - "token"
    - "secret"
