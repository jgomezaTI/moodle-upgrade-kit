project:
  name: example-moodle-docker
  environment: staging
  timezone: America/Santiago

moodle:
  # Host/WSL-visible bind mount used for source, Git, plugins and disk inspection.
  root: /home/user/projects/moodle/public_html
  moodledata: /home/user/projects/moodle/public_html/moodledata
  base_url: https://moodle.example.invalid
  target_version: "4.1"
  cron_command: "php admin/cli/cron.php"

runtime:
  type: docker
  container: moodle-php-1
  moodle_root: /var/www/html
  moodledata: /var/www/moodledata

safety:
  allow_mutation: false
  require_environment: staging
  require_clean_git: true
  require_backup_check: true
  require_human_gate: true
  max_backup_age_hours: 24

inventory:
  min_free_gb: 5

plugins:
  # Plugin type roots to enumerate. Entries are not assumed to be custom just
  # because their type root is listed here.
  custom_roots:
    - local
    - report
    - blocks
    - mod
    - auth
  # Explicit non-core plugins known by the project. local/* is classified as
  # custom automatically because Moodle core does not ship local plugins.
  custom_paths:
    - auth/examplecustom
    - blocks/examplecustom

custom_code:
  # Paths are resolved relative to moodle.root. Parent-relative paths are allowed
  # when the resolved target remains inside the Git repository root.
  # Example layout:
  #   project/
  #   ├── public_html/   <- moodle.root
  #   │   └── portal_v3/
  #   └── autonomina/
  paths:
    - portal_v3
    - ../autonomina
  auto_detect_top_level: true
  max_files_per_path: 50000

backup:
  paths: []

database:
  driver: mysql
  # Optional Docker DB container. No DB credentials are required for inventory;
  # only Docker image/running state and the server binary version are inspected.
  runtime_container: moodle-db-1
