[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "moodle-upgrade-kit"
version = "0.1.0"
description = "Auditable Moodle upgrade validation and orchestration toolkit"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
muk = "moodle_upgrade.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
