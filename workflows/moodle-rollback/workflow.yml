schema_version: "1.0"
workflow:
  id: moodle-rollback
  name: Moodle Rollback
  description: Explicitly gated rollback workflow.
  inputs:
    config:
      type: string
      required: true
    run_id:
      type: string
      required: true
  steps:
    - id: rollback-review
      type: gate
      message: "Confirm the exact backup set and restoration plan before rollback."
      options: [approve, reject]
      on_reject: abort
    - id: rollback
      type: command
      command: speckit.moodle.rollback
      input:
        args: "--config {{ inputs.config }} --run-id {{ inputs.run_id }} --approved"
    - id: validate
      type: command
      command: speckit.moodle.validate
      input:
        args: "--config {{ inputs.config }} --run-id {{ inputs.run_id }} --mode rollback"
    - id: document
      type: command
      command: speckit.moodle.document
      input:
        args: "--config {{ inputs.config }} --run-id {{ inputs.run_id }}"
